<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Flask ejemplo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor encabezado__contenido">
            <a href="{{ url_for('inicio') }}" class="logo">Flask<span>Ejemplo</span></a>
            <nav class="menu">
                <a href="{{ url_for('inicio') }}" class="{{ 'activo' if request.endpoint == 'inicio' }}">Inicio</a>
                <a href="{{ url_for('estudiantes') }}" class="{{ 'activo' if request.endpoint == 'estudiantes' }}">Estudiantes</a>
                <a href="{{ url_for('contacto') }}" class="{{ 'activo' if request.endpoint == 'contacto' }}">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor principal">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>Taller de Aplicaciones &middot; Ejemplo con Flask y plantillas Jinja</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
